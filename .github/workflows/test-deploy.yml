name: Test Product deployment
run-name: Test Product deployment 

on:
  pull_request:
    paths-ignore:
      - '**/README.md'
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  test-deploy:
    strategy:
      fail-fast: false
      matrix:
        playbook: ['playbook-product-local.yml', 'playbook-srfa-local.yml']
    uses: rancher/product-docs-common/.github/workflows/test-deploy-min.yml@bef76c9aab79980088a221e72e006acd3bfd8257# main
    secrets:
      token: ${{ github.token }}
    with:
      playbook-name: ${{ matrix.playbook }}
